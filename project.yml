# XcodeGen spec: the source of truth for DieselReady.xcodeproj.
# After adding, moving or removing files, regenerate with:  xcodegen generate
name: DieselReady
options:
  bundleIdPrefix: uk.co.meltemiapps
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DieselReady:
    type: application
    platform: iOS
    sources:
      - path: DieselReady
        excludes:
          - "Resources/Content/**"
      - path: DieselReady/Resources/Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.meltemiapps.dieselready
        PRODUCT_NAME: DieselReady
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Diesel Ready
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  DieselReadyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DieselReadyTests]
    dependencies:
      - target: DieselReady
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.meltemiapps.dieselready.tests
  DieselReadyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DieselReadyUITests]
    dependencies:
      - target: DieselReady
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.meltemiapps.dieselready.uitests
        TEST_TARGET_NAME: DieselReady
schemes:
  DieselReady:
    build:
      targets:
        DieselReady: all
        DieselReadyTests: [test]
        DieselReadyUITests: [test]
    test:
      targets: [DieselReadyTests, DieselReadyUITests]
